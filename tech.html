<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Litpax — Repair Floor</title>
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="tech-manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tech.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <span class="brand-mark">L</span>
      <div>
        <div class="brand-name">Repair Floor</div>
        <div class="brand-date" id="tDate">—</div>
      </div>
    </div>
    <button class="refresh" id="tRefresh" data-act="refresh" aria-label="Refresh">↻</button>
  </div>
  <div class="tally">
    <div class="tally-num"><b id="tDone">0</b> of <span id="tTotal">0</span> items complete today</div>
    <div class="tally-bar"><i id="tBar"></i></div>
  </div>
</header>

<main class="list" id="tList"></main>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="tech.js"></script>
</body>
</html>

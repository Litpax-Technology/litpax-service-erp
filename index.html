<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litpax Service Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">L</div>
      <div><div class="brand-name">LITPAX</div><div class="brand-sub">Service Hub</div></div>
    </div>
    <div class="fg"><label>Username</label><input id="loginUser" autocomplete="username"></div>
    <div class="fg"><label>PIN</label>
      <div class="pass-wrap">
        <input id="loginPass" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')authLogin()">
        <span class="pass-eye" onclick="loginTogglePass(this)">👁</span>
      </div>
    </div>
    <button id="loginBtn" class="btn btn-primary btn-block" onclick="authLogin()">Login</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appWrap" class="app-wrap" style="display:none">
  <aside id="sidebar" class="sidebar">
    <div class="brand sb-brand">
      <div class="brand-logo">L</div>
      <div><div class="brand-name">LITPAX</div><div class="brand-sub">Service Hub</div></div>
    </div>
    <div id="sbRole" class="sb-role"></div>
    <nav id="sbNav" class="sb-nav"></nav>
    <button class="sb-logout" onclick="logout()">⎋ Logout</button>
  </aside>
  <div id="sbOverlay" class="sb-overlay" onclick="toggleSidebar(false)"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div><div id="hdrTitle" class="hdr-title"></div><div id="hdrSub" class="hdr-sub"></div></div>
    </header>

    <!-- ===== PHASE 1: NEW TICKET ===== -->
    <section id="scrNew" class="screen">
      <div id="newForm" class="card form-card">
        <div class="card-head"><span>📝 Basic Record</span><span class="chip-soft">Ticket ID auto banega</span></div>
        <div class="form-grid">
          <div class="fg full"><label>Customer Company Name <b>*</b></label><input id="n_company" maxlength="150" placeholder="e.g. ABC Motors"></div>
          <div class="fg"><label>Contact Person <b>*</b></label><input id="n_person" maxlength="100"></div>
          <div class="fg"><label>Phone <b>*</b></label><input id="n_phone" inputmode="numeric" maxlength="10" placeholder="10 digit"></div>
          <div class="fg full"><label>Scooty Brand <b>*</b></label><input id="n_brand" maxlength="100" placeholder="Kis brand ki scooty use kar rahe hain"></div>
          <div class="fg full"><label>Battery company ko bhej di hai? <b>*</b></label>
            <div class="seg" id="n_sentSeg">
              <button type="button" data-v="Yes" onclick="segPick(this)">🚚 Haan, bhej di</button>
              <button type="button" data-v="No" onclick="segPick(this)">✋ Nahi</button>
            </div>
          </div>
        </div>
        <button id="n_submit" class="btn btn-primary btn-block" onclick="ticketCreate()">Ticket Banao ✓</button>
      </div>

      <div id="newSuccess" class="card success-card" style="display:none">
        <div class="success-ico">✅</div>
        <div class="success-title">Ticket ban gaya</div>
        <div id="newId" class="success-id"></div>
        <div class="success-sub">Service Team ise Tickets list me dekh ke call karegi.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="newReset()">➕ Ek aur ticket</button>
          <button class="btn btn-primary" id="newOpenBtn" onclick="openTicketFromNew(this.dataset.id)">Ticket kholo →</button>
        </div>
      </div>
    </section>

    <!-- ===== TICKETS LIST ===== -->
    <section id="scrTickets" class="screen">
      <div class="toolbar">
        <input id="tkSearch" class="search" placeholder="🔍 Ticket ID, company, phone, brand..." oninput="tkRender()">
        <button class="btn btn-ghost btn-icon" title="Refresh" onclick="tkLoad(true)">↻</button>
      </div>
      <div id="tkChips" class="chips"></div>
      <div id="tkList" class="tk-list"></div>
    </section>

    <!-- ===== PHASE 3: REPAIR BOARD ===== -->
    <section id="scrBoard" class="screen">
      <div class="board-grid">
        <div class="card">
          <div class="card-head"><span>⏳ Pending — plan nahi hue <b id="pendCount" class="count">0</b></span>
            <button class="btn btn-ghost btn-icon" title="Refresh" onclick="boardLoad(true)">↻</button></div>
          <div id="boardPending"></div>
        </div>
        <div class="card">
          <div class="card-head"><span>🔧 Planned <b id="repairCount" class="count">0</b></span>
            <input type="date" id="boardDateFilter" class="date-sm" onchange="boardRender()" title="Plan date (khaali = sab)"></div>
          <div id="boardActive" class="board-cards"></div>
        </div>
      </div>
    </section>

    <!-- ===== PHASE 3: DISPATCH ===== -->
    <section id="scrDispatch" class="screen">
      <div class="card">
        <div class="card-head"><span>📦 Ready — Final QC &amp; Pack</span>
          <button class="btn btn-ghost btn-icon" title="Refresh" onclick="dispLoad(true)">↻</button></div>
        <input id="dSearch" class="search" placeholder="🔍 Item / Ticket / Customer" oninput="dispRender()">
        <div id="dList" class="d-list"></div>
      </div>
      <div class="card">
        <div class="card-head"><span>🚚 Dispatch Details — <b id="dSelCount">0</b> selected</span></div>
        <div class="form-grid">
          <div class="fg"><label>Dispatch Date <b>*</b></label><input type="date" id="d_date"></div>
          <div class="fg"><label>Dispatched By <b>*</b></label><input id="d_by" maxlength="100"></div>
          <div class="fg"><label>Transport (Outward)</label><input id="d_transport" maxlength="150" placeholder="Transport / AWB / LR"></div>
          <div class="fg"><label>Any Cost (₹)</label><input id="d_cost" maxlength="30"></div>
          <div class="fg full"><label>Actual Problem Found</label><textarea id="d_problem" maxlength="500"></textarea></div>
          <div class="fg full"><label>Dispatch Address</label><textarea id="d_address" maxlength="300"></textarea></div>
          <div class="fg full"><label>Remarks</label><input id="d_remarks" maxlength="500"></div>
        </div>
        <button id="dSubmit" class="btn btn-primary btn-block" onclick="dispSubmit()">Dispatch Karo 🚚</button>
      </div>
    </section>
  </main>
</div>

<!-- ================= TICKET DRAWER ================= -->
<div id="drawerOv" class="drawer-ov" onclick="drawerClose()"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head"><div id="drTitle" class="dr-title"></div><button class="x-btn" onclick="drawerClose()">✕</button></div>
  <div id="drBody" class="drawer-body"></div>
</aside>

<!-- ================= MODAL ================= -->
<div id="modalOv" class="modal-ov" onclick="if(event.target===this)modalClose()">
  <div class="modal">
    <div class="modal-head"><span id="mdTitle"></span><button class="x-btn" onclick="modalClose()">✕</button></div>
    <div id="mdBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
